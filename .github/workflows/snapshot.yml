name: Daily signal snapshot

on:
  schedule:
    - cron: "0 6 * * *"   # daily 06:00 UTC
  workflow_dispatch: {}    # manual run button in the Actions tab

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Take snapshot
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "oil-price-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots.csv
          git diff --cached --quiet || git commit -m "Daily snapshot $(date -u +%F)"
          git push
